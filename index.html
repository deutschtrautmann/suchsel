<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Suchsel</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        margin: 0;
        background: #f9fbfd;
        color: #333;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    /* Texteingaben dürfen weiterhin selektierbar sein */
    textarea, input[type="text"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        user-select: text;
    }

    #spieltitel {
        margin: 0 0 18px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #spieltitel .titel-icon {
        font-size: 1em;
        line-height: 1;
        user-select: none;
        -webkit-text-fill-color: initial;
        display: inline;
    }

    #spieltitel h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 34px);
        font-weight: 800;
        letter-spacing: 0px;
        line-height: 1.1;
        background: linear-gradient(135deg, #2c7be5 0%, #38c172 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    #spieltitel .titel-untertitel {
        font-size: clamp(10px, 2.5vw, 13px);
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-top: 1px;
    }

    .container {
        min-height: 70px;
        border: 3px dashed #ccc;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        align-content: flex-start;
    }

    .word {
        background: white;
        padding: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 22px);
        border-radius: 12px;
        box-shadow: 0 3px 7px rgba(0,0,0,0.12);
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        border: 1px solid #ddd;
        font-size: clamp(14px, 3.5vw, 17px);
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        transition: background 0.2s, opacity 0.2s, border-color 0.2s;
    }

    #app-box {
        background: #fff;
        border: none;
        border-radius: 0;
        padding: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 16px));
        padding-right: max(16px, env(safe-area-inset-right, 16px));
        padding-top: max(16px, env(safe-area-inset-top, 16px));
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
    }

    button {
        margin-top: 15px;
        width: 100%;
        max-width: 340px;
        padding: clamp(14px, 4vw, 18px);
        font-size: clamp(16px, 4.5vw, 20px);
        border: none;
        border-radius: 15px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
        display: block;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        min-height: 48px;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    button:active { filter: brightness(0.9); }
    @media (hover: hover) {
        button:hover { filter: brightness(1.05); }
    }
    .restart-btn { background: #3498db; }

    #fileLabel {
        display: inline-block;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 12px;
        touch-action: manipulation;
    }
    #fileInput { display: none; }

    .progress {
        font-size: clamp(12px, 3vw, 14px);
        color: #888;
        margin-bottom: 4px;
    }

    .top-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .top-button,
    #fileLabel {
        flex: 1 1 100px;
        max-width: 150px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: clamp(12px, 3vw, 14px);
        cursor: pointer;
        color: #333;
        box-sizing: border-box;
        margin: 0;
        line-height: 1;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        white-space: nowrap;
    }

    @media (hover: hover) {
        .top-button:hover,
        #fileLabel:hover { background: #dce8fd; }
    }

    #textModal {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #textModalContent {
        background: white;
        width: 100%;
        max-width: 720px;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        max-height: 90vh;
        max-height: 90dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #textInputArea {
        width: 100%;
        min-height: 200px;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        resize: vertical;
        font-family: inherit;
        -webkit-overflow-scrolling: touch;
    }

    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .modal-buttons button { max-width: 220px; margin-top: 0; }
    .secondary-btn { background: #7f8c8d; }

    /* ── Maskottchen Bereich (Schaf) ────────────────────────── */
    #mascot-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        margin-bottom: 5px;
        padding: 12px;
        background: #f4f9f4;
        border-radius: 18px;
        border: 2px solid #c2e0c2;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #mascot-image {
        width: clamp(60px, 15vw, 90px);
        height: clamp(67px, 16vw, 100px);
        flex-shrink: 0;
        transform-origin: bottom center;
        animation: floatMascot 4s ease-in-out infinite;
    }

    .sheep-svg { width: 100%; height: 100%; }

    .eye-happy, .mouth-happy { display: block; }
    .eye-sad, .mouth-sad { display: none; }

    .is-sad .eye-happy { display: none; }
    .is-sad .eye-sad { display: block; }
    .is-sad .mouth-happy { display: none; }
    .is-sad .mouth-sad { display: block; }

    #mascot-heart {
        display: none;
        transform-origin: 50px 72px;
        animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .has-heart #mascot-heart { display: block; }
    .has-heart #left-arm {
        transform: rotate(25deg) translate(2px, -4px) !important;
        animation: none !important;
    }
    .has-heart #right-arm {
        transform: rotate(-25deg) translate(-2px, -4px) !important;
        animation: none !important;
    }

    @keyframes heartPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .animate-jump { animation: jumpMascot 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important; }
    .animate-shake { animation: shakeMascot 0.5s ease-in-out forwards !important; }

    #mascot-speech-bubble {
        background: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        position: relative;
        border: 1px solid #d4ebd4;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex-grow: 1;
    }

    #mascot-speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 30px;
        border-width: 6px 10px 6px 0;
        border-style: solid;
        border-color: transparent white transparent transparent;
    }

    #mascot-text {
        margin: 0;
        font-size: clamp(13px, 3.5vw, 16px);
        line-height: 1.4;
        font-weight: 500;
        color: #2c3e50;
    }

    .blink-pupil { animation: blinkAnimation 5s infinite; transform-origin: center; }
    @keyframes blinkAnimation {
        0%, 95%, 100% { transform: scaleY(1); opacity: 1; }
        97% { transform: scaleY(0.1); opacity: 0.1; }
    }

    #left-leg { animation: stepLeft 3s infinite ease-in-out; transform-origin: top center; }
    #right-leg { animation: stepRight 3s infinite ease-in-out; transform-origin: top center; }
    @keyframes stepLeft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes stepRight { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(0); } }

    #left-arm { animation: waveLeft 4s infinite ease-in-out; transform-origin: 32px 58px; }
    #right-arm { animation: waveRight 4s infinite ease-in-out; transform-origin: 68px 58px; }
    @keyframes waveLeft { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    @keyframes waveRight { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

    @keyframes floatMascot {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
    }

    @keyframes jumpMascot {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(2px) scaleY(0.9); }
        50% { transform: translateY(-20px) scaleY(1.1); }
        80% { transform: translateY(0) scaleY(0.95); }
        100% { transform: translateY(0) scale(1); }
    }

    @keyframes shakeMascot {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    /* ── Schlaf-Zustand ──────────────────────────────────────── */
    .is-sleeping #mascot-image { animation: sleepFloat 3s ease-in-out infinite !important; }
    .is-sleeping #left-leg, .is-sleeping #right-leg, .is-sleeping #left-arm, .is-sleeping #right-arm {
        animation: none !important;
    }
    .is-sleeping #left-arm { transform: rotate(15deg) translate(1px, 2px); }
    .is-sleeping #right-arm { transform: rotate(-15deg) translate(-1px, 2px); }
    .is-sleeping .eye-happy, .is-sleeping .eye-sad, .is-sleeping .mouth-happy,
    .is-sleeping .mouth-sad, .is-sleeping .blink-pupil {
        display: none !important;
        animation: none !important;
    }
    .is-sleeping .eye-sleep { display: block !important; }
    .is-sleeping .mouth-sleep { display: block !important; }
    .eye-sleep { display: none; }
    .mouth-sleep { display: none; }

    #sleep-zzz {
        display: none;
        position: absolute;
        top: -8px;
        right: -8px;
        font-size: clamp(12px, 3vw, 16px);
        animation: zzzFloat 2s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
    }
    .is-sleeping #sleep-zzz { display: block; }

    @keyframes zzzFloat {
        0%   { transform: translate(0, 0)   scale(0.8); opacity: 0.4; }
        40%  { transform: translate(4px, -8px) scale(1.1); opacity: 1; }
        100% { transform: translate(8px, -16px) scale(0.6); opacity: 0; }
    }
    @keyframes sleepFloat {
        0%   { transform: translateY(0px) rotate(-2deg); }
        50%  { transform: translateY(-3px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(-2deg); }
    }

    .is-sleeping #mascot-speech-bubble { opacity: 0.55; transition: opacity 0.6s ease; }
    #mascot-container:not(.is-sleeping) #mascot-speech-bubble { opacity: 1; transition: opacity 0.4s ease; }

    /* ── Suchsel-Gitter ───────────────────────────────────────── */
    .suchsel-aufgabe { margin: 4px 0 12px 0; font-weight: 600; }

    .suchsel-grid-wrap {
        display: flex;
        justify-content: center;
        margin: 4px 0 16px 0;
        container-type: inline-size;
    }

    .suchsel-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), 1fr);
        grid-template-rows: repeat(var(--cols), 1fr);
        gap: 2px;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1 / 1;
        background: #dfefff;
        border: 3px solid #90c0f0;
        border-radius: 16px;
        padding: 6px;
        touch-action: none;
        box-sizing: border-box;
    }

    .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 3px;
        font-weight: 700;
        color: #333;
        cursor: pointer;
        user-select: none;
        font-size: 16px; /* Fallback für Browser ohne Container Queries */
        font-size: clamp(9px, calc(88cqw / var(--cols)), 26px);
        transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .cell.selecting { background: #ffe08a; transform: scale(1.08); }
    .cell.found { background: #b8e6b8; color: #1f6b1f; }

    .wortliste { justify-content: center; }
    .wort-chip { cursor: default; touch-action: auto; }
    .wort-chip.gefunden {
        text-decoration: line-through;
        opacity: 0.55;
        background: #eafaea;
        border-color: #9ed69e;
    }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS – Mobile · Tablet · Desktop
       ══════════════════════════════════════════════════════════ */

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    @media (max-width: 360px) {
        #app-box { padding: 10px; }
        .top-controls { gap: 5px; }
        .top-button, #fileLabel {
            font-size: 10px; padding: 0 6px; height: 40px; flex: 1 1 80px; max-width: 120px;
        }
        #spieltitel h1 { font-size: 20px; }
        .word { padding: 8px 12px; font-size: 13px; }
        button { font-size: 15px; padding: 12px; }
    }

    @media (min-width: 361px) and (max-width: 480px) {
        #app-box { padding: 12px; }
        .top-controls { gap: 6px; }
        .top-button, #fileLabel { font-size: 11px; padding: 0 8px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        #mascot-container { padding: 6px 10px; gap: 8px; margin-top: 6px; margin-bottom: 4px; }
        #mascot-image { width: 46px; height: 52px; }
        #mascot-text { font-size: 11px; }
        #spieltitel { margin-bottom: 8px; }
        #spieltitel h1 { font-size: 20px; }
        .container { padding: 10px; gap: 7px; min-height: 54px; }
        .word { padding: 7px 10px; font-size: 13px; min-height: 36px; }
        button { margin-top: 8px; padding: 10px; font-size: 15px; }
        .suchsel-grid { max-width: 260px; }
    }

    @media (min-width: 481px) and (max-width: 768px) {
        #app-box { padding: 20px 24px; }
        .top-button, #fileLabel { font-size: 13px; max-width: 160px; }
        .word { font-size: 15px; padding: 10px 16px; }
        #mascot-image { width: 70px; height: 78px; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
        body { background: #eef2f7; }
        #app-box {
            max-width: 720px; margin: 24px auto; padding: 28px 36px;
            min-height: unset; border-radius: 22px; box-shadow: 0 6px 28px rgba(0,0,0,0.09);
        }
        .word { font-size: 16px; }
        .top-button, #fileLabel { max-width: 160px; font-size: 13px; }
    }

    @media (min-width: 700px) {
        body { background: #eef2f7; }
        #app-box {
            max-width: 820px; margin: 28px auto; padding: 32px 40px;
            min-height: unset; border-radius: 24px; box-shadow: 0 6px 32px rgba(0,0,0,0.09);
        }
        .container { padding: 16px; gap: 12px; }
        .word { font-size: 16px; padding: 11px 20px; }
        button { max-width: 300px; }
        .restart-btn { max-width: 300px; }
        .top-button, #fileLabel { height: 46px; font-size: 14px; max-width: 165px; }
        #mascot-container { padding: 14px 16px; gap: 14px; }
    }

    @media (min-width: 1280px) {
        #app-box { max-width: 900px; padding: 36px 48px; margin-top: 36px; }
        #spieltitel h1 { font-size: 36px; }
        .word { font-size: 17px; padding: 12px 22px; }
        .container { gap: 14px; padding: 18px; }
        #mascot-image { width: 88px; height: 98px; }
    }

    @supports (-webkit-overflow-scrolling: touch) {
        .container { -webkit-overflow-scrolling: touch; }
    }

    @supports (padding: max(0px)) {
        #app-box {
            padding-left:   max(16px, env(safe-area-inset-left));
            padding-right:  max(16px, env(safe-area-inset-right));
            padding-top:    max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        @media (min-width: 700px) {
            #app-box {
                padding-left:   max(40px, env(safe-area-inset-left));
                padding-right:  max(40px, env(safe-area-inset-right));
                padding-top:    max(32px, env(safe-area-inset-top));
                padding-bottom: max(32px, env(safe-area-inset-bottom));
            }
        }
    }

    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        .word { box-shadow: 0 2px 6px rgba(0,0,0,0.10); }
    }

    @media (prefers-color-scheme: dark) {
        body { background: #1a1f2e; color: #e8eaf0; }
        #app-box { background: #242938; }
        .container { background: #2e3447; border-color: #4a5270; }
        .word { background: #353c55; border-color: #4a5270; color: #e8eaf0; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        #mascot-container { background: #1e2d20; border-color: #3a6a3a; }
        #mascot-speech-bubble { background: #2e3a2e; border-color: #3a6a3a; }
        #mascot-text { color: #d0e8d0; }
        .top-button, #fileLabel { background: #2a3555; border-color: #4a72b0; color: #c8d8f0; }
        #textModalContent { background: #242938; color: #e8eaf0; }
        #textInputArea { background: #1a1f2e; border-color: #4a5270; color: #e8eaf0; }
        .suchsel-grid { background: #1e2d45; border-color: #3a6090; }
        .cell { background: #353c55; color: #e8eaf0; }
        .cell.selecting { background: #7a6a2a; }
        .cell.found { background: #2f5a34; color: #cdeccd; }
        .wort-chip.gefunden { background: #24382a; border-color: #3a6a3a; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
</style>
</head>
<body>
<div id="app-box">

<div id="spieltitel">
    <div>
        <h1>Wörter<span class="titel-icon">🔍</span>Suchsel</h1>
        <div class="titel-untertitel">Finde alle versteckten Wörter</div>
    </div>
</div>

<div class="top-controls">
    <label id="fileLabel" class="top-button" for="fileInput"></label>
    <div id="textInputBtn" class="top-button"></div>
    <div id="musicToggleBtn" class="top-button"></div>
</div>

<input type="file" id="fileInput" accept=".txt">

<div id="textModal">
    <div id="textModalContent">
        <h3 id="modalTitel"></h3>
        <p id="modalHinweis"></p>
        <textarea id="textInputArea"></textarea>

        <div class="modal-buttons">
            <button id="applyTextBtn"></button>
            <button id="closeTextBtn" class="secondary-btn"></button>
        </div>
    </div>
</div>

<div id="mascot-container">
    <div id="mascot-image" style="position:relative;">
        <span id="sleep-zzz">💤</span>
        <svg class="sheep-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
            <g id="left-leg">
                <rect x="33" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 33 95 L 43 95 L 43 100 L 33 100 Z" fill="#4a4a4a"/>
            </g>
            <g id="right-leg">
                <rect x="57" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 57 95 L 67 95 L 67 100 L 57 100 Z" fill="#4a4a4a"/>
            </g>

            <path d="M 30 30 Q 10 20 15 40 Q 20 45 32 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>
            <path d="M 70 30 Q 90 20 85 40 Q 80 45 68 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>

            <ellipse cx="23" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(-30 23 35)"/>
            <ellipse cx="77" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(30 77 35)"/>

            <circle cx="50" cy="58" r="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="30" cy="45" r="12" fill="#ffffff"/>
            <circle cx="70" cy="45" r="12" fill="#ffffff"/>
            <circle cx="50" cy="38" r="14" fill="#ffffff"/>
            <circle cx="25" cy="65" r="12" fill="#ffffff"/>
            <circle cx="75" cy="65" r="12" fill="#ffffff"/>
            <circle cx="40" cy="80" r="12" fill="#ffffff"/>
            <circle cx="60" cy="80" r="12" fill="#ffffff"/>

            <ellipse cx="50" cy="48" rx="18" ry="16" fill="#ffffff"/>

            <g id="mascot-heart">

const MELODY_PATTERN = [0, 2, 4, 2, 5, 4, 2, 0, 3, 2, 0, 7, 5, 4, 2, 4];

// ── Schlaf-System (Inaktivität) ───────────────────────────────────
const SLEEP_DELAY = 20000;
let sleepTimer = null;
let isSleeping = false;

function wakeUpMascot() {
    if (!isSleeping) { resetSleepTimer(); return; }
    isSleeping = false;
    document.getElementById('mascot-container').classList.remove('is-sleeping');
    resetSleepTimer();
}

function putMascotToSleep() {
    if (isSleeping) return;
    isSleeping = true;
    document.getElementById('mascot-container').classList.add('is-sleeping');
}

function resetSleepTimer() {
    if (sleepTimer) clearTimeout(sleepTimer);
    sleepTimer = setTimeout(putMascotToSleep, SLEEP_DELAY);
}

['mousedown','touchstart','keydown','pointerdown'].forEach(evt => {
    document.addEventListener(evt, wakeUpMascot, { passive: true });
});
resetSleepTimer();

function shiftProceduralMusic() {
    proceduralSeed = Math.random();
    const scalePools = [
        [1, 1.2, 1.33, 1.5, 1.6, 1.8, 2],
        [1, 1.25, 1.44, 1.5, 1.75, 1.875, 2],
        [1, 1.125, 1.35, 1.5, 1.6, 1.9, 2]
    ];
    currentPattern = scalePools[Math.floor(proceduralSeed * scalePools.length)];
}

// ── Prozedurale Audio-Engine ───────────────────────────────────────
let audioCtx = null;
let ambientStarted = false;
let ambientInterval = null;
let musicEnabled = true;
let beatIndex = 0;
let errorDamping = 0;

function initAudio() {
    try {
        if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            audioCtx = new AudioCtx();
        }
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        if (!ambientStarted) { ambientStarted = true; startAmbientMusic(); }
    } catch(e) { audioCtx = null; }
}

function tone(freq, type='sine', start=0, dur=0.18, vol=0.15, endFreq=null, filterFreq=2200) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    osc.type = type;

    const now = audioCtx.currentTime + start;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq) { osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur); }

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + dur);
    } catch(e) { /* Audio-Fehler ignorieren */ }
}

function getPuzzleProgress() {
    if (!currentPuzzle || currentPuzzle.words.length === 0) return 0;
    return foundCount / currentPuzzle.words.length;
}

function startAmbientMusic() {
    if (!musicEnabled) return;
    if (!playStartTime) playStartTime = Date.now();

    function playBeatStep() {
        if (!musicEnabled) { ambientInterval = null; return; }

        const progress = getPuzzleProgress();
        const baseNote = 110;
        const elapsed = (Date.now() - playStartTime) / 1000;

        if (errorDamping > 0) errorDamping -= 0.1;

        if (beatIndex % 4 === 0) {
            const droneVol = (0.28 - errorDamping * 0.15);
            const dynamicDroneModifier = 1 + (proceduralSeed * 0.02);
            tone(baseNote * dynamicDroneModifier, 'sine', 0, 1.4, Math.max(0.05, droneVol), baseNote * 1.002, 800);
            tone(baseNote * 1.5, 'sine', 0.2, 1.2, Math.max(0.02, droneVol * 0.4), baseNote * 1.502, 900);
        }

        if (progress > 0.1) {
            const noteStep = (beatIndex + Math.floor(proceduralSeed * 10)) % currentPattern.length;
            const arpFreq = baseNote * 2 * currentPattern[noteStep];
            const arpVol = (0.09 + progress * 0.09) * (1 - errorDamping * 0.5);
            const waveform = proceduralSeed > 0.5 ? 'triangle' : 'sine';
            tone(arpFreq, waveform, 0, 0.22, arpVol, arpFreq * 1.005, 2000);
            if (progress > 0.4 && beatIndex % 2 === 0) {
                tone(arpFreq * 1.33, 'sine', 0.06, 0.12, 0.04, null, 2500);
            }
        }

        if (progress > 0.6) {
            const clickVol = 0.05 + (progress * 0.04);
            if (beatIndex % 2 === 0) {
                tone(1200 + (proceduralSeed * 400), 'triangle', 0, 0.04, clickVol, 400, 3500);
            } else {
                tone(180, 'sine', 0, 0.08, clickVol * 1.4, 70, 600);
            }
        }

        if (elapsed > 120) {
            const fadeIn = Math.min(1, (elapsed - 120) / 30);
            if (beatIndex % 3 === 0) {
                const note = MELODY_NOTES[MELODY_PATTERN[melodyIndex % MELODY_PATTERN.length]];
                melodyIndex++;
                const melVol = 0.07 * fadeIn * (1 - errorDamping * 0.4);
                tone(note, 'sine', 0, 0.35, melVol, note * 1.002, 3000);
                if (beatIndex % 6 === 0) {
                    tone(note * 1.5, 'sine', 0.1, 0.25, melVol * 0.4, note * 1.502, 2500);
                }
            }
        }

        if (elapsed > 300) {
            const fadeIn = Math.min(1, (elapsed - 300) / 60);
            if (beatIndex % 8 === 0) {
                const windFreq = 80 + Math.random() * 40;
                tone(windFreq, 'sine', 0, 1.8, 0.04 * fadeIn, windFreq * (0.95 + Math.random() * 0.1), 400);
                tone(windFreq * 1.2, 'sine', 0.3, 1.4, 0.02 * fadeIn, windFreq * 1.1, 350);
            }
            if (beatIndex % 13 === 0 && Math.random() > 0.4) {
                const birdBase = 1800 + Math.random() * 800;
                tone(birdBase, 'sine', 0,    0.06, 0.06 * fadeIn, birdBase * 1.3, 4000);
                tone(birdBase * 1.3, 'sine', 0.07, 0.05, 0.05 * fadeIn, birdBase * 0.9, 4000);
                tone(birdBase * 0.9, 'sine', 0.13, 0.06, 0.04 * fadeIn, birdBase * 1.1, 4000);
            }
        }

        if (elapsed > 600) {
            const fadeIn = Math.min(1, (elapsed - 600) / 60);
            if (beatIndex % 4 === 0) {
                const padNotes = [baseNote * 2, baseNote * 2.5, baseNote * 3];
                padNotes.forEach((freq, i) => {
                    tone(freq, 'sawtooth', i * 0.05, 1.6, 0.04 * fadeIn, freq * 1.001, 500);
                });
            }
            if (beatIndex % 8 === 0) { tone(60, 'sine', 0, 0.12, 0.1 * fadeIn, 30, 300); }
            if (beatIndex % 8 === 4) { tone(200, 'triangle', 0, 0.05, 0.06 * fadeIn, 150, 800); }
        }

        beatIndex++;
        ambientInterval = setTimeout(playBeatStep, 460);
    }
    playBeatStep();
}

function playPop() {
    shiftProceduralMusic();
    const popFreq = 540 + (Math.random() * 120);
    tone(popFreq, 'sine', 0, 0.08, 0.22, popFreq + 100, 2500);

// ── Datei-Einlesen ────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const bufReader = new FileReader();
    bufReader.onload = (ev) => {
        const buffer = ev.target.result;
        const bytes = new Uint8Array(buffer);
        const hasUtf8Bom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;

        function isValidUtf8(bytes) {
            let i = hasUtf8Bom ? 3 : 0;
            while (i < bytes.length) {
                const b = bytes[i];
                let extra = 0;
                if (b <= 0x7F) { i++; continue; }
                else if (b >= 0xC2 && b <= 0xDF) extra = 1;
                else if (b >= 0xE0 && b <= 0xEF) extra = 2;
                else if (b >= 0xF0 && b <= 0xF4) extra = 3;
                else return false;
                for (let j = 1; j <= extra; j++) {
                    if (i + j >= bytes.length || (bytes[i + j] & 0xC0) !== 0x80) return false;
                }
                i += extra + 1;
            }
            return true;
        }

        let encoding = 'UTF-8';
        if (!hasUtf8Bom && !isValidUtf8(bytes)) { encoding = 'windows-1252'; }

        const textReader = new FileReader();
        textReader.onload = (ev2) => {
            let text = ev2.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            processData(text);
            e.target.value = '';
        };
        textReader.readAsText(file, encoding);
    };
    bufReader.readAsArrayBuffer(file);
});

function processData(text) {

    return true;

// ── Wörter-Parsing ────────────────────────────────────────────────
function splitLineWords(line) {
    let parts = line.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
    if (parts.length <= 1) {
        const wsParts = line.split(/\s+/).map(s => s.trim()).filter(Boolean);
        if (wsParts.length > 1) parts = wsParts;
    }
    return parts;
}

function parseText(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    return lines.map(splitLineWords).filter(arr => arr.length > 0);
}

function cleanWord(w) {
    return w.toUpperCase().replace(/ß/g, 'SS').replace(/[^A-ZÄÖÜ]/g, '');
}

function buildWordsMeta(rawWords) {
    const seen = new Map();
    rawWords.forEach(raw => {
        const display = raw.trim();
        if (!display) return;
        const clean = cleanWord(display);
        if (clean.length < 2) return;
        if (!seen.has(clean)) seen.set(clean, { display, clean, found: false, chipEl: null });
    });
    return [...seen.values()];
}

// ── Gitter-Generierung ──────────────────────────────────────────────
function shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function attemptGrid(words, size) {
    const grid = Array.from({ length: size }, () => Array(size).fill(null));
    let order = shuffleArr(words.slice());
    order.sort((a, b) => b.length - a.length); // längste zuerst, Reihenfolge bei Gleichstand bleibt gemischt

    for (const word of order) {
        const wlen = word.length;
        const positions = [];

        // waagrecht
        for (let r = 0; r < size; r++) {
            for (let c = 0; c <= size - wlen; c++) {
                let overlap = 0, ok = true;
                for (let k = 0; k < wlen; k++) {
                    const cell = grid[r][c + k];
                    if (cell !== null) { if (cell !== word[k]) { ok = false; break; } overlap++; }
                }
                if (ok) positions.push({ r, c, dir: 0, overlap });
            }
        }
        // senkrecht (von oben nach unten)
        for (let c = 0; c < size; c++) {
            for (let r = 0; r <= size - wlen; r++) {
                let overlap = 0, ok = true;
                for (let k = 0; k < wlen; k++) {
                    const cell = grid[r + k][c];
                    if (cell !== null) { if (cell !== word[k]) { ok = false; break; } overlap++; }
                }
                if (ok) positions.push({ r, c, dir: 1, overlap });
            }
        }

        if (positions.length === 0) return null;

        const maxOverlap = positions.reduce((m, p) => Math.max(m, p.overlap), 0);
        const best = positions.filter(p => p.overlap === maxOverlap);
        const pick = best[Math.floor(Math.random() * best.length)];

        for (let k = 0; k < wlen; k++) {
            if (pick.dir === 0) grid[pick.r][pick.c + k] = word[k];
            else grid[pick.r + k][pick.c] = word[k];
        }
    }
    return grid;
}

function forcePlaceGrid(words) {
    const maxLen = Math.max(...words.map(w => w.length));
    const size = Math.max(maxLen, words.length);
    const grid = Array.from({ length: size }, () => Array(size).fill(null));
    words.forEach((word, i) => { for (let k = 0; k < word.length; k++) { grid[i][k] = word[k]; } });
    return { grid, size };
}

function fillRandom(grid) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
            if (grid[r][c] === null) { grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)]; }
        }
    }
}

function buildGrid(rawWords) {
    const words = [...new Set(rawWords)].filter(w => w.length >= 2);
    if (words.length === 0) { return { grid: [['?']], size: 1 }; }

    const maxLen = Math.max(...words.map(w => w.length));
    const totalLetters = words.reduce((s, w) => s + w.length, 0);
    let size = Math.max(maxLen, Math.ceil(Math.sqrt(totalLetters * 1.3)));
    const hardCap = size + 20;

    for (; size <= hardCap; size++) {
        for (let attempt = 0; attempt < 50; attempt++) {
            const g = attemptGrid(words, size);
            if (g) { fillRandom(g); return { grid: g, size }; }
        }
    }
    const forced = forcePlaceGrid(words);
    fillRandom(forced.grid);
    return forced;
}

function generatePuzzleData(wordsMeta) {
    const cleanList = wordsMeta.map(w => w.clean);
    const { grid, size } = buildGrid(cleanList);
    return { grid, size, words: wordsMeta };
}

        el.textContent = TEXTE.gefundenAnzeige.replace('{f}', foundCount).replace('{t}', currentPuzzle.words.length);
    }

function renderPuzzle(opts = {}) {
    const isReshuffle = !!opts.isReshuffle;
    const game = document.getElementById('game');
    const mischenBtn = document.getElementById('mischenBtn');

    if (currentIndex >= puzzleList.length) {
        setMascotMood(false);
        triggerMascotAnimation('jump');
        updateMascot(TEXTE.endeMaskott);
        mischenBtn.style.display = 'none';
        document.getElementById('mascot-container').classList.remove('has-heart');

        game.innerHTML = '';
        const btn = document.createElement('button');
        btn.className = 'restart-btn';
        btn.textContent = TEXTE.endeBtnNochmal;
        btn.onclick = () => { currentIndex = 0; renderPuzzle(); };
        game.appendChild(btn);
        return;
    }

    const rawWords = puzzleList[currentIndex];
    const wordsMeta = buildWordsMeta(rawWords);
    if (wordsMeta.length === 0) { currentIndex++; renderPuzzle(); return; }

    currentPuzzle = generatePuzzleData(wordsMeta);
    foundCount = 0;

    game.innerHTML = '';
    document.getElementById('mascot-container').classList.remove('has-heart');
    mischenBtn.style.display = 'block';

    if (isReshuffle) {
        setMascotMood(false);
        updateMascot(getRandomElement(TEXTE.neuGemischt));
    } else if (currentIndex > 0) {
        setMascotMood(false);
        updateMascot(TEXTE.naechstesRaetsel.replace('{nr}', currentIndex + 1));
    }

    const fortschritt = document.createElement('div');
    fortschritt.className = 'progress';
    fortschritt.textContent = TEXTE.fortschritt.replace('{nr}', currentIndex + 1).replace('{gesamt}', puzzleList.length);
    game.appendChild(fortschritt);

    const aufgabe = document.createElement('p');
    aufgabe.className = 'suchsel-aufgabe';
    aufgabe.textContent = TEXTE.aufgabe;
    game.appendChild(aufgabe);

    const gridWrap = document.createElement('div');
    gridWrap.className = 'suchsel-grid-wrap';
    const gridEl = document.createElement('div');
    gridEl.className = 'suchsel-grid';
    gridEl.style.setProperty('--cols', currentPuzzle.size);

    currentPuzzle.cellEls = [];
    for (let r = 0; r < currentPuzzle.size; r++) {
        const rowArr = [];
        for (let c = 0; c < currentPuzzle.size; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.textContent = currentPuzzle.grid[r][c];
            gridEl.appendChild(cell);
            rowArr.push(cell);
        }
        currentPuzzle.cellEls.push(rowArr);
    }
    gridWrap.appendChild(gridEl);
    game.appendChild(gridWrap);
    attachGridEvents(gridEl);

    const wortFortschritt = document.createElement('div');
    wortFortschritt.className = 'progress';
    wortFortschritt.id = 'wortFortschritt';
    game.appendChild(wortFortschritt);

    const list = document.createElement('div');
    list.className = 'container wortliste';
    currentPuzzle.words.forEach(w => {
        const chip = document.createElement('div');
        chip.className = 'word wort-chip';
        chip.textContent = w.display;
        list.appendChild(chip);
        w.chipEl = chip;
    });
    game.appendChild(list);

    updateProgressText();
}

// ── Auswahl im Gitter ─────────────────────────────────────────────
function attachGridEvents(gridEl) {
    gridEl.addEventListener('pointerdown', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        e.preventDefault();
        initAudio();
        dragging = true;
        startCell = cell;
        currentPath = [[+cell.dataset.r, +cell.dataset.c]];
        highlightPath(currentPath);
        try { gridEl.setPointerCapture(e.pointerId); } catch (err) {}
    });

    gridEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const cell = el && el.closest && el.closest('.cell');
        if (!cell || !gridEl.contains(cell)) return;
        updateSelectionPath(cell);
    });

    const finish = () => {
        if (!dragging) return;
        dragging = false;
        finalizeSelection();
    };
    gridEl.addEventListener('pointerup', finish);
    gridEl.addEventListener('pointercancel', finish);
    document.addEventListener('pointerup', finish);
}

function updateSelectionPath(endCell) {
    const r0 = +startCell.dataset.r, c0 = +startCell.dataset.c;
    const r1 = +endCell.dataset.r, c1 = +endCell.dataset.c;
    let path = [];

    if (r0 === r1) {
        const step = c1 >= c0 ? 1 : -1;
        for (let c = c0; ; c += step) { path.push([r0, c]); if (c === c1) break; }
    } else if (c0 === c1) {
        const step = r1 >= r0 ? 1 : -1;
        for (let r = r0; ; r += step) { path.push([r, c0]); if (r === r1) break; }
    } else {
        return; // kein gerader Verlauf – vorherige gültige Auswahl beibehalten
    }

    currentPath = path;
    highlightPath(path);
}

function highlightPath(path) {
    if (!currentPuzzle) return;
    currentPuzzle.cellEls.flat().forEach(c => c.classList.remove('selecting'));
    path.forEach(([r, c]) => { currentPuzzle.cellEls[r][c].classList.add('selecting'); });
}

function finalizeSelection() {
    startCell = null;
    if (!currentPuzzle || currentPath.length === 0) { currentPath = []; return; }

    const letters = currentPath.map(([r, c]) => currentPuzzle.grid[r][c]).join('');
    const reversed = letters.split('').reverse().join('');
    const match = currentPuzzle.words.find(w => !w.found && (w.clean === letters || w.clean === reversed));

    if (match) {
        markWordFound(match, currentPath);
    } else {
        currentPuzzle.cellEls.flat().forEach(c => c.classList.remove('selecting'));
    }
    currentPath = [];
}

function markWordFound(match, path) {
    match.found = true;
    path.forEach(([r, c]) => {
        const cell = currentPuzzle.cellEls[r][c];
        cell.classList.remove('selecting');
        cell.classList.add('found');
    });
    if (match.chipEl) match.chipEl.classList.add('gefunden');

    foundCount++;
    updateProgressText();

    setMascotMood(false);
    triggerMascotAnimation('jump');
    updateMascot(getRandomElement(TEXTE.wortGefunden));
    playPartial();

    if (foundCount === currentPuzzle.words.length) {
        setTimeout(completePuzzle, 900);
    }
}

function completePuzzle() {
    playStarSound();
    triggerMascotAnimation('jump');
    document.getElementById('mascot-container').classList.add('has-heart');
    updateMascot(getRandomElement(TEXTE.alleGefunden));
    setTimeout(() => { currentIndex++; renderPuzzle(); }, 2200);
}

// ── Neu mischen ───────────────────────────────────────────────────
document.getElementById('mischenBtn').addEventListener('click', () => {
    initAudio();
    playClick();
    renderPuzzle({ isReshuffle: true });
});

// ── Start ─────────────────────────────────────────────────────────
window.onload = () => {
    puzzleList = parseText(TEXTE.beispiel);
    currentIndex = 0;
    renderPuzzle();
};
</script>

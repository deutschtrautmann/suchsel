<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Suchsel</title>
<meta name="author" content="deutschtrautmann">
<meta name="copyright" content="© 2026 deutschtrautmann — alle Rechte vorbehalten">
<style>
    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        margin: 0;
        background: #f9fbfd;
        color: #333;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    /* Texteingaben dürfen weiterhin selektierbar sein */
    textarea, input[type="text"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        user-select: text;
    }

    #spieltitel {
        margin: 0 0 18px 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    #spieltitel .titel-icon {
        font-size: 1em;
        line-height: 1;
        user-select: none;
        -webkit-text-fill-color: initial;
        display: inline;
    }

    #spieltitel h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 34px);
        font-weight: 800;
        letter-spacing: 0px;
        line-height: 1.1;
        background: linear-gradient(135deg, #2c7be5 0%, #38c172 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    #spieltitel .titel-untertitel {
        font-size: clamp(10px, 2.5vw, 13px);
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-top: 1px;
    }

    .container {
        min-height: 70px;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 14px 16px;
        margin-top: 10px;
        background: #f4f8ff;
        font-size: clamp(14px, 3.5vw, 17px);
        line-height: 1.7;
        color: #2c3e6b;
    }
    #app-box {
        background: #fff;
        border: none;
        border-radius: 0;
        padding: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 16px));
        padding-right: max(16px, env(safe-area-inset-right, 16px));
        padding-top: max(16px, env(safe-area-inset-top, 16px));
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
    }

    button {
        margin-top: 15px;
        width: 100%;
        max-width: 340px;
        padding: clamp(14px, 4vw, 18px);
        font-size: clamp(16px, 4.5vw, 20px);
        font-weight: 700;
        border: none;
        border-radius: 999px;
        background: linear-gradient(180deg, #8be890 0%, #4CAF50 45%, #388e3c 100%);
        color: white;
        cursor: pointer;
        display: block;
        position: relative;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        min-height: 48px;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        box-shadow: 0 4px 0 #2e7d32, 0 6px 12px rgba(0,0,0,0.22);
        text-shadow: 0 1px 2px rgba(0,0,0,0.25);
        transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
    }
    button::before {
        content: '';
        position: absolute;
        top: 8%;
        left: 6%;
        right: 6%;
        height: 40%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
        pointer-events: none;
    }
    button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #2e7d32, 0 2px 5px rgba(0,0,0,0.2);
        filter: brightness(0.97);
    }
    @media (hover: hover) {
        button:hover { filter: brightness(1.05); }
    }
    .restart-btn {
        background: linear-gradient(180deg, #7cc9f5 0%, #3498db 45%, #2874a6 100%);
        box-shadow: 0 4px 0 #21618c, 0 6px 12px rgba(0,0,0,0.22);
    }
    .restart-btn:active {
        box-shadow: 0 1px 0 #21618c, 0 2px 5px rgba(0,0,0,0.2);
    }

    /* "Neu mischen"-Knopf: zentriert und schmaler statt volle Breite */
    #mischenBtn {
        max-width: 170px;
        margin-left: auto;
        margin-right: auto;
    }

    #fileLabel {
        display: inline-block;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 999px;
        padding: 0 10px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 12px;
        touch-action: manipulation;
    }
    #fileInput { display: none; }

    .progress {
        font-size: clamp(12px, 3vw, 14px);
        color: #888;
        margin-bottom: 4px;
    }

    .top-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .top-button,
    #fileLabel {
        flex: 1 1 90px;
        max-width: 120px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: linear-gradient(180deg, #f5f9ff 0%, #e8f0fe 60%, #dbe9fc 100%);
        border: 1px solid #a9c8ef;
        border-radius: 999px;
        padding: 0 12px;
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 700;
        cursor: pointer;
        color: #333;
        box-sizing: border-box;
        margin: 0;
        line-height: 1;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        white-space: nowrap;
        position: relative;
        overflow: hidden;
        box-shadow: 0 2px 0 #4a90d9, 0 3px 6px rgba(0,0,0,0.12);
        transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s;
    }

    .top-button::before,
    #fileLabel::before {
        content: '';
        position: absolute;
        top: 10%;
        left: 8%;
        right: 8%;
        height: 38%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 100%);
        pointer-events: none;
    }

    .top-button:active,
    #fileLabel:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #4a90d9, 0 1px 3px rgba(0,0,0,0.12);
    }

    @media (hover: hover) {
        .top-button:hover,
        #fileLabel:hover { background: linear-gradient(180deg, #eef5ff 0%, #dce8fd 60%, #cfe0fb 100%); }
    }

    #textModal {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #textModalContent {
        background: white;
        width: 100%;
        max-width: 720px;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        max-height: 90vh;
        max-height: 90dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Thema-Auswahl: natives Pulldown-Menü, in der oberen Werkzeugleiste
       ganz links neben "Textdatei" – bewusst gleich breit wie die
       Knöpfe "Textdatei" und "Texteingabe" (siehe .top-button, #fileLabel). */
    .thema-select {
        flex: 1 1 90px;
        max-width: 120px;
        height: 34px;
        background: #fff;
        border: 2px solid #b7c7dd;
        border-radius: 10px;
        padding: 0 6px;
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 700;
        color: #2c3e6b;
        box-sizing: border-box;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
    }
    .thema-select:focus { outline: none; border-color: #4a90d9; }

    /* Lautsprecher-Symbol: schlicht, einfarbig, ohne Button-Optik –
       sitzt direkt neben dem Titel (rechts in der Titelzeile). */
    .icon-plain-button {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        box-shadow: none;
        border-radius: 8px;
        padding: 4px;
        margin: 0 0 0 auto;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        color: #6b7c99;
        position: static;
        overflow: visible;
    }
    /* Verhindert, dass der generische Glanz-Overlay aller <button>-Elemente
       (button::before) hier als zusätzliche helle Fläche über dem Icon
       durchscheint. */
    .icon-plain-button::before { content: none; }
    .icon-plain-button svg { width: 100%; height: 100%; display: block; }
    .icon-plain-button:active { opacity: 0.6; }
    @media (hover: hover) {
        .icon-plain-button:hover { color: #4a90d9; }
    }

    #themaBox {
        margin-bottom: 14px;
    }

    #themaLabel {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #667;
        margin-bottom: 6px;
    }

    #themaInputArea {
        width: 100%;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 16px;
        font-family: inherit;
        box-sizing: border-box;
    }

    #textInputArea {
        width: 100%;
        min-height: 200px;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        resize: vertical;
        font-family: inherit;
        -webkit-overflow-scrolling: touch;
    }

    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .modal-buttons button {
        max-width: 170px;
        margin-top: 0;
        padding: clamp(8px, 2.5vw, 11px) clamp(14px, 3.5vw, 18px);
        font-size: clamp(12px, 3vw, 14px);
        min-height: 36px;
    }
    .secondary-btn {
        background: linear-gradient(180deg, #b9c2c3 0%, #7f8c8d 45%, #626c6d 100%);
        box-shadow: 0 4px 0 #566061, 0 6px 12px rgba(0,0,0,0.22);
    }
    .secondary-btn:active {
        box-shadow: 0 1px 0 #566061, 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ── Maskottchen Bereich (Schaf) ────────────────────────── */
    #mascot-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        margin-bottom: 5px;
        padding: 12px;
        background: #f4f9f4;
        border-radius: 18px;
        border: 2px solid #c2e0c2;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #mascot-image {
        width: clamp(60px, 15vw, 90px);
        height: clamp(67px, 16vw, 100px);
        flex-shrink: 0;
        transform-origin: bottom center;
        animation: floatMascot 4s ease-in-out infinite;
    }

    .sheep-svg { width: 100%; height: 100%; }

    .eye-happy, .mouth-happy { display: block; }
    .eye-sad, .mouth-sad { display: none; }

    .is-sad .eye-happy { display: none; }
    .is-sad .eye-sad { display: block; }
    .is-sad .mouth-happy { display: none; }
    .is-sad .mouth-sad { display: block; }

    #mascot-heart {
        display: none;
        transform-origin: 50px 72px;
        animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .has-heart #mascot-heart { display: block; }
    .has-heart #left-arm {
        transform: rotate(25deg) translate(2px, -4px) !important;
        animation: none !important;
    }
    .has-heart #right-arm {
        transform: rotate(-25deg) translate(-2px, -4px) !important;
        animation: none !important;
    }

    @keyframes heartPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .animate-jump { animation: jumpMascot 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important; }
    .animate-shake { animation: shakeMascot 0.5s ease-in-out forwards !important; }

    #mascot-speech-bubble {
        background: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        position: relative;
        border: 1px solid #d4ebd4;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex: 0 1 auto;
        min-width: 0;
        transition: opacity 0.3s ease;
    }

    #mascot-speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        border-width: 6px 10px 6px 0;
        border-style: solid;
        border-color: transparent white transparent transparent;
    }

    #mascot-text {
        margin: 0;
        font-size: clamp(13px, 3.5vw, 16px);
        line-height: 1.4;
        font-weight: 700;
        color: #2c3e50;
    }

    .blink-pupil { animation: blinkAnimation 5s infinite; transform-origin: center; }
    @keyframes blinkAnimation {
        0%, 95%, 100% { transform: scaleY(1); opacity: 1; }
        97% { transform: scaleY(0.1); opacity: 0.1; }
    }

    #left-leg { animation: stepLeft 3s infinite ease-in-out; transform-origin: top center; }
    #right-leg { animation: stepRight 3s infinite ease-in-out; transform-origin: top center; }
    @keyframes stepLeft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes stepRight { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(0); } }

    #left-arm { animation: waveLeft 4s infinite ease-in-out; transform-origin: 32px 58px; }
    #right-arm { animation: waveRight 4s infinite ease-in-out; transform-origin: 68px 58px; }
    @keyframes waveLeft { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    @keyframes waveRight { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

    @keyframes floatMascot {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
    }

    @keyframes jumpMascot {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(2px) scaleY(0.9); }
        50% { transform: translateY(-20px) scaleY(1.1); }
        80% { transform: translateY(0) scaleY(0.95); }
        100% { transform: translateY(0) scale(1); }
    }

    @keyframes shakeMascot {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    /* ── Schlaf-Zustand ──────────────────────────────────────── */
    .is-sleeping #mascot-image { animation: sleepFloat 3s ease-in-out infinite !important; }
    .is-sleeping #left-leg, .is-sleeping #right-leg, .is-sleeping #left-arm, .is-sleeping #right-arm {
        animation: none !important;
    }
    .is-sleeping #left-arm { transform: rotate(15deg) translate(1px, 2px); }
    .is-sleeping #right-arm { transform: rotate(-15deg) translate(-1px, 2px); }
    .is-sleeping .eye-happy, .is-sleeping .eye-sad, .is-sleeping .mouth-happy,
    .is-sleeping .mouth-sad, .is-sleeping .blink-pupil {
        display: none !important;
        animation: none !important;
    }
    .is-sleeping .eye-sleep { display: block !important; }
    .is-sleeping .mouth-sleep { display: block !important; }
    .eye-sleep { display: none; }
    .mouth-sleep { display: none; }

    #sleep-zzz {
        display: none;
        position: absolute;
        top: -8px;
        right: -8px;
        font-size: clamp(12px, 3vw, 16px);
        animation: zzzFloat 2s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
    }
    .is-sleeping #sleep-zzz { display: block; }

    @keyframes zzzFloat {
        0%   { transform: translate(0, 0)   scale(0.8); opacity: 0.4; }
        40%  { transform: translate(4px, -8px) scale(1.1); opacity: 1; }
        100% { transform: translate(8px, -16px) scale(0.6); opacity: 0; }
    }
    @keyframes sleepFloat {
        0%   { transform: translateY(0px) rotate(-2deg); }
        50%  { transform: translateY(-3px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(-2deg); }
    }

    .is-sleeping #mascot-speech-bubble { opacity: 0.55; transition: opacity 0.6s ease; }
    #mascot-container:not(.is-sleeping) #mascot-speech-bubble { opacity: 1; transition: opacity 0.4s ease; }

    /* ── Suchsel-Gitter ───────────────────────────────────────── */
    .suchsel-aufgabe { margin: 4px 0 12px 0; font-weight: 600; }

    .suchsel-grid-wrap {
        display: flex;
        justify-content: center;
        margin: 4px 0 16px 0;
        container-type: inline-size;
    }

    .suchsel-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), 1fr);
        grid-template-rows: repeat(var(--cols), 1fr);
        gap: 2px;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1 / 1;
        background: #dfefff;
        border: 3px solid #90c0f0;
        border-radius: 16px;
        padding: 6px;
        touch-action: none;
        box-sizing: border-box;
    }

    .cell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 3px;
        font-weight: 700;
        color: #333;
        cursor: pointer;
        user-select: none;
        font-size: 16px; /* Fallback für Browser ohne Container Queries */
        font-size: clamp(9px, calc(88cqw / var(--cols)), 26px);
        transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .cell.selecting {
        background: #ffe08a;
    }
    .cell.found { background: #b8e6b8; color: #1f6b1f; }

    /* Lupen-Blase: zeigt den gerade berührten Buchstaben stark vergrößert
       über dem Finger an. Wird nur bei Touch-Eingabe eingeblendet
       (siehe JS: pointerType === 'touch'). Bei Maus/Trackpad/Stift bleibt
       sie unsichtbar, damit dort keine zusätzliche Vergrößerung erscheint. */
    #letterMagnifier {
        position: fixed;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 56px;
        min-height: 56px;
        padding: 4px 10px;
        background: #222;
        color: #fff;
        font-weight: 800;
        font-size: 40px;
        line-height: 1;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        pointer-events: none;
        user-select: none;
        z-index: 1000;
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.85);
        transition: opacity 0.08s ease-out, transform 0.08s ease-out;
        will-change: transform, opacity;
    }
    #letterMagnifier::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 16px;
        height: 16px;
        background: inherit;
        transform: translateX(-50%) rotate(45deg);
        border-radius: 2px;
    }
    #letterMagnifier.visible {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
    }
    @media (prefers-contrast: more) {
        #letterMagnifier { background: #000; outline: 2px solid #fff; }
    }
    @media (prefers-reduced-motion: reduce) {
        #letterMagnifier { transition: none; }
    }

    #mascot-container { cursor: pointer; touch-action: manipulation; }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS – Mobile · Tablet · Desktop
       ══════════════════════════════════════════════════════════ */

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    @media (max-width: 360px) {
        #app-box { padding: 10px; }
        .top-controls { gap: 4px; }
        .top-button, #fileLabel, .thema-select {
            font-size: 9px; padding: 0 5px; height: 28px; flex: 1 1 70px; max-width: 95px;
        }
        #spieltitel h1 { font-size: 20px; }
        .icon-plain-button { width: 26px; height: 26px; }
        button { font-size: 15px; padding: 12px; }
    }

    @media (min-width: 361px) and (max-width: 480px) {
        #app-box { padding: 12px; }
        .top-controls { gap: 5px; }
        .top-button, #fileLabel, .thema-select { font-size: 10px; padding: 0 6px; height: 30px; max-width: 105px; }
    }

    @media (max-height: 700px) and (orientation: portrait) {
        #spieltitel { margin-bottom: 10px; }
        #mascot-container { padding: 8px 12px; margin-top: 8px; margin-bottom: 4px; }
        #mascot-image { width: 56px; height: 62px; }
        #mascot-text { font-size: 13px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        #mascot-container { padding: 6px 10px; gap: 8px; margin-top: 6px; margin-bottom: 4px; }
        #mascot-image { width: 46px; height: 52px; }
        #mascot-text { font-size: 11px; }
        #spieltitel { margin-bottom: 8px; }
        #spieltitel h1 { font-size: 20px; }
        .top-button, #fileLabel, .thema-select { height: 26px; font-size: 9px; }
        .container { padding: 10px 12px; min-height: 54px; }
        button { margin-top: 8px; padding: 10px; font-size: 15px; }
        .suchsel-grid { max-width: 260px; }
    }
